# FOGUETE 2 — "GARANTIA" (menor pressão, motor fixo de 1,2 L)
# Estratégia do Murilo: o edital dá 4 frascos de 750 ml (=3,0 L) para os 2
# lançamentos. O Foguete 1 (bit04) usa 1,8 L. Sobram 1,2 L para este 2º
# foguete — que é o voo de garantia: menos pressão (~140 psi vs 200 psi),
# mais seguro. Aqui descobrimos que FORMATO rende mais nessa pressão menor.
#
# Corpo: mesma garrafa PET 2 L (fiel, buildável, já validada a 170 psi).
# Motor: FIXO em VinagreReal-1_2L (não é escolha — é o combustível que sobra).
# Livre: coifa, lastro Durepoxi, aletas, ângulo. Materiais reais (PLA + poliestireno).

base_ork: D:\1-Competicoes\OBAFOG\foguetes\bit04 2L script\foguete_real\garrafa2L_base.ork

paths:
  openrocket_dir: C:\Program Files\OpenRocket

simulation:
  overrides:
    random_seed: 42          # trilho 1 m, vento 2 m/s contra — herdados do .ork
    time_step: 0.01          # passo fino (queima curta ~0,16 s)

parameters:
  # ---------- ogiva (será impressa em PLA) ----------
  - name: nose_length
    component: Ogiva
    attribute: length
    unit: cm
    low: 6.0
    high: 30.0

  - name: nose_shape
    component: Ogiva
    attribute: shape
    choices: [CONICAL, OGIVE, ELLIPSOID, HAACK, PARABOLIC, POWER]

  - name: nose_shape_param
    component: Ogiva
    attribute: shape_parameter
    unit: ""
    low: 0.0
    high: 1.0

  - name: nose_thickness
    component: Ogiva
    attribute: thickness
    unit: mm
    low: 0.8
    high: 2.5

  - name: nose_material
    component: Ogiva
    attribute: bulk_material
    choices: [pla]

  # ---------- lastro Durepoxi (massa derivada do volume, sem metal) ----------
  - name: ballast_fill
    component: Componente de massa
    attribute: durepox_fill
    unit: cm
    low: 0.0
    high: 30.0
    options:
      density_g_cm3: 1.7

  # ---------- aletas (poliestireno 1–2 mm, no ombro da garrafa) ----------
  - name: fin_count
    component: Conjunto de aletas de formato livre
    attribute: fin_count
    unit: ""
    low: 3
    high: 4
    integer: true

  - name: fin_root
    component: Conjunto de aletas de formato livre
    attribute: ff_root
    unit: cm
    low: 6.0
    high: 16.0

  - name: fin_tip
    component: Conjunto de aletas de formato livre
    attribute: ff_tip
    unit: cm
    low: 0.0
    high: 16.0

  - name: fin_sweep
    component: Conjunto de aletas de formato livre
    attribute: ff_sweep
    unit: cm
    low: 0.0
    high: 16.0

  - name: fin_height
    component: Conjunto de aletas de formato livre
    attribute: ff_height
    unit: cm
    low: 3.0
    high: 15.0

  - name: fin_thickness
    component: Conjunto de aletas de formato livre
    attribute: thickness
    unit: mm
    low: 1.0
    high: 2.0

  - name: fin_material
    component: Conjunto de aletas de formato livre
    attribute: bulk_material
    choices: [poliestireno]

  # sem cant (angulação) — decisão já tomada no bit04
  - name: fin_cant
    component: Conjunto de aletas de formato livre
    attribute: cant_angle
    unit: deg
    low: 0.0
    high: 0.0

  # posição afastada da boca da garrafa (folga p/ o gatilho, como no bit04)
  - name: fin_position
    component: Conjunto de aletas de formato livre
    attribute: position
    unit: cm
    low: -6.0
    high: -2.8

  # ---------- motor FIXO: 1,2 L (o vinagre que sobra) ----------
  - name: motor
    component: Garrafa 2L - cilindro
    attribute: motor
    choices:
      - "file:D:\\1-Competicoes\\OBAFOG\\foguetes\\bit04 2L script\\foguete_real\\motores\\VinagreReal-1_2L.eng"

  # ---------- ângulo do trilho de lançamento (graus da vertical) ----------
  - name: launch_angle
    component: Ogiva
    attribute: sim_launch_rod_angle_deg
    unit: ""
    low: 35.0
    high: 60.0

objective:
  metric: horizontal_distance
  direction: maximize

# Foguete de GARANTIA: um pouco mais de margem de estabilidade que o mínimo
# do regulamento (1,0 cal), e raiz de aleta colável de verdade (anti-gaming).
constraints:
  - metric: stability_static
    min: 0.2
  - metric: stability_max
    min: 1.1
    max: 3.5
  - metric: apogee
    min: 10.0
  - metric: fin_root_cm
    min: 6.0
  - metric: fin_root_ratio
    min: 0.30

optimizer:
  algorithm: adaptive
  max_evaluations: 12000
  seed: 42
  profile: balanced

batch:
  workers: 4

db_path: D:\1-Competicoes\OBAFOG\laboratorios\_foguete2_garantia\orx.sqlite
output_dir: D:\1-Competicoes\OBAFOG\laboratorios\_foguete2_garantia
