# bit07 — foguete ROBUSTO A PRESSÃO (garrafa PET 2L retornável)
#
# Nasce da falha real de 2026-08: bit04 e bit05 foram lançados, a bancada só deu
# 140–150 psi (não os 170 de projeto), os dois saíram rasos e bateram na cerca.
# O diagnóstico (scripts/diagnostico_pressao_bit0405.py) mostrou que a pressão
# sozinha custa ~10% de alcance — o que os dois tinham em comum era MARGEM ZERO:
# estabilidade mínima 0,46 cal (bit04) e 0,24 cal (bit05), e o bit04 com
# estabilidade pós-queima exatamente 1,00 cal.
#
# Este arquivo é a ETAPA 1 da busca: varredura ampla e paralela no PIOR cenário
# realista (140 psi), já com as restrições duras que faltavam. A pontuação
# completa (alcance × robustez × leveza × segurança) é aplicada na ETAPA 2 por
# scripts/bit07_robusto.py, que re-simula os finalistas em TODAS as pressões.

base_ork: D:\OBAFOG\bit04 2L script\foguete_real\garrafa2L_base.ork

paths:
  openrocket_dir: C:\Program Files\OpenRocket

simulation:
  overrides:
    random_seed: 42
    wind_speed_average: 2.0
    launch_rod_length: 1.0

parameters:
  # ---------- ogiva (impressa em 3D) ----------
  - name: nose_length
    component: Ogiva
    attribute: length
    unit: cm
    low: 6.0
    high: 30.0
  - name: nose_shape
    component: Ogiva
    attribute: shape
    choices: [CONICAL, OGIVE, ELLIPSOID, HAACK, PARABOLIC, POWER]
  - name: nose_shape_param
    component: Ogiva
    attribute: shape_parameter
    unit: ""
    low: 0.0
    high: 1.0
  - name: nose_thickness
    component: Ogiva
    attribute: thickness
    unit: mm
    low: 0.6
    high: 3.0
  - name: nose_material
    component: Ogiva
    attribute: bulk_material
    choices: [pla, poliestireno, papel_cartao]

  # ---------- lastro de Durepoxi no bico (sem metal, regulamento) ----------
  # massa DERIVADA do volume real do bico (8 discos, CG fisicamente correto)
  - name: ballast_fill
    component: Componente de massa
    attribute: durepox_fill
    unit: cm
    low: 0.0
    high: 26.0
    options:
      density_g_cm3: 1.7

  # ---------- aletas ----------
  - name: fin_count
    component: Conjunto de aletas de formato livre
    attribute: fin_count
    unit: ""
    low: 3
    high: 6
    integer: true
  - name: fin_root
    component: Conjunto de aletas de formato livre
    attribute: ff_root
    unit: cm
    low: 3.0
    high: 14.0
  - name: fin_tip
    component: Conjunto de aletas de formato livre
    attribute: ff_tip
    unit: cm
    low: 0.0
    high: 16.0
  - name: fin_sweep
    component: Conjunto de aletas de formato livre
    attribute: ff_sweep
    unit: cm
    low: 0.0
    high: 14.0
  - name: fin_height
    component: Conjunto de aletas de formato livre
    attribute: ff_height
    unit: cm
    low: 3.0
    high: 15.0
  - name: fin_thickness
    component: Conjunto de aletas de formato livre
    attribute: thickness
    unit: mm
    low: 0.6
    high: 3.0
  - name: fin_material
    component: Conjunto de aletas de formato livre
    attribute: bulk_material
    choices: [poliestireno, pla, pet_garrafa, papel_cartao]
  - name: fin_cant
    component: Conjunto de aletas de formato livre
    attribute: cant_angle
    unit: deg
    low: -2.0
    high: 2.0
  - name: fin_position
    component: Conjunto de aletas de formato livre
    attribute: position
    unit: cm
    low: -3.0
    high: 0.0

  # ---------- carga de vinagre (o motor) ----------
  # Etapa 1 usa a coluna de 140 psi — o pior cenário que a bancada entregou de
  # verdade. A etapa 2 troca a pressão do MESMO arquivo (mesma carga).
  - name: motor
    component: Garrafa 2L - cilindro
    attribute: motor
    choices:
      - "file:D:\\OBAFOG\\bit07 robusto 2L\\motores\\Bit07-L0_90-P140.eng"
      - "file:D:\\OBAFOG\\bit07 robusto 2L\\motores\\Bit07-L1_10-P140.eng"
      - "file:D:\\OBAFOG\\bit07 robusto 2L\\motores\\Bit07-L1_30-P140.eng"
      - "file:D:\\OBAFOG\\bit07 robusto 2L\\motores\\Bit07-L1_45-P140.eng"
      - "file:D:\\OBAFOG\\bit07 robusto 2L\\motores\\Bit07-L1_55-P140.eng"
      - "file:D:\\OBAFOG\\bit07 robusto 2L\\motores\\Bit07-L1_70-P140.eng"
      - "file:D:\\OBAFOG\\bit07 robusto 2L\\motores\\Bit07-L1_80-P140.eng"

  - name: launch_angle
    component: Ogiva
    attribute: sim_launch_rod_angle_deg
    unit: ""
    low: 30.0
    high: 60.0

# Etapa 1 otimiza A PRÓPRIA NOTA da etapa 2, avaliada no pior cenário (140 psi).
# É a mesma fórmula de scripts/bit07_robusto.py, menos o termo de consistência
# (que precisa de várias pressões). Alinhamento importa: a primeira rodada usou
# "alcance − peso" como atalho e o resultado foram 40 finalistas colados na borda
# de 1,0 cal — o mesmo vício do bit04. Aqui a estabilidade e a leveza PAGAM ponto
# desde a primeira simulação, então a busca não vive na borda.
#
#   40 pts alcance   (150 m -> 0 pt ; 400 m -> 40 pts)
#   20 pts leveza    (700 g -> 0 pt ; 250 g -> 20 pts)   dry_mass = sem propelente
#   10 pts estabilidade mínima (1,08 cal -> 0 pt ; 2,08 cal -> 10 pts)
#    5 pts saída do trilho     (15 m/s -> 0 pt ; 25 m/s -> 5 pts)
objective:
  metric: 40*min(1,max(0,(horizontal_distance-150)/250)) + 20*min(1,max(0,(0.700-dry_mass)/0.450)) + 10*min(1,max(0,(stability_min-1.08)/1.0)) + 5*min(1,max(0,(launch_rod_velocity-15)/10))
  direction: maximize

# As restrições que FALTAVAM no bit04/bit05:
constraints:
  # <<< a restrição que matou bit04/bit05 por ausência. 1,08 e não 1,00: a
  # estabilidade cai ~0,02 cal da menor para a maior pressão, e um design que
  # marca 1,00 cal a 140 psi é reprovado a 180 psi. A margem é o ponto.
  - metric: stability_min
    min: 1.08
    max: 3.5
  - metric: stability_max
    min: 1.0
    max: 3.5
  - metric: launch_rod_velocity  # sai rápido do tubo-guia = tolera tip-off e vento
    min: 15.0
  - metric: apogee
    min: 40.0
  - metric: fin_root_ratio       # aleta colada por raiz suficiente (não descola)
    min: 0.5

optimizer:
  algorithm: adaptive
  max_evaluations: 6000
  seed: 42
  profile: balanced
  options:
    chunk_size: 1500

batch:
  workers: 4

db_path: D:\OBAFOG\bit07 robusto 2L\simulacoes\orx_nota.sqlite
output_dir: D:\OBAFOG\bit07 robusto 2L\simulacoes
