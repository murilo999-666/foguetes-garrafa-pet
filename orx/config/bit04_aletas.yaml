# BIT04 v6: 3 ALETAS, SEM CANT. COIFA impressa travada. Raiz >=6cm e >=30% corda
# (aletas bem coladas, nao descolam). Livre: aletas, lastro (ate o
# limite da coifa ~426g), angulo e motor. Aletas >=2,8cm da boca (gatilho).
# MATERIAIS REAIS DE CONSTRUÇÃO TRAVADOS: ogiva PLA impressa, aletas
# poliestireno 1,0 mm. Lastro = Durepoxi (1,7 g/cm3). Original:
# - garrafa: geometria/massa fiéis à REF-PET 2L (104 mm, ~100 g, bocal PCO 28)
# - motor: modelo físico vinagre 4% + bicarbonato em excesso, calibrado no
#   dado real do Murilo (1,55 L -> 170 psi); 8 cargas de vinagre diferentes
# - ângulo do lançamento também é otimizado (25-60°)
# Objetivo: máximo alcance horizontal, como se fosse lançado de verdade.

base_ork: D:\OBAFOG\bit04 2L script\foguete_real\garrafa2L_base.ork

paths:
  openrocket_dir: C:\Program Files\OpenRocket

simulation:
  overrides:
    random_seed: 42
    time_step: 0.01              # passo fino: queima de ~0,3s em ~30 passos
                                 # (0,05 padrao deixava a queima em 4-8 passos)          # trilho 1 m, vento 2 m/s contra — herdados do .ork

parameters:
  # ---------- ogiva (impressa em 3D) ----------
  - name: nose_length
    component: Ogiva
    attribute: length
    unit: cm
    low: 7.9845                     # COIFA JA IMPRESSA - travada
    high: 7.9845

  - name: nose_shape
    component: Ogiva
    attribute: shape
    choices: [PARABOLIC]            # COIFA JA IMPRESSA - travada

  - name: nose_shape_param
    component: Ogiva
    attribute: shape_parameter
    unit: ""
    low: 0.7028                     # COIFA JA IMPRESSA - travada
    high: 0.7028

  - name: nose_thickness
    component: Ogiva
    attribute: thickness
    unit: mm
    low: 1.1209                     # COIFA JA IMPRESSA - travada
    high: 1.1209

  - name: nose_material
    component: Ogiva
    attribute: bulk_material
    choices: [pla]                  # COIFA JA IMPRESSA - travada                 # TRAVADO: ogiva impressa em PLA

  # ---------- lastro Durepoxi (sem metal; massa derivada do volume) ----------
  - name: ballast_fill
    component: Componente de massa
    attribute: durepox_fill
    unit: cm
    low: 0.0
    high: 28.0
    options:
      density_g_cm3: 1.7

  # ---------- aletas (no ombro da garrafa) ----------
  - name: fin_count
    component: Conjunto de aletas de formato livre
    attribute: fin_count
    unit: ""
    low: 3                          # TRAVADO em 3 aletas
    high: 3
    integer: true

  - name: fin_root
    component: Conjunto de aletas de formato livre
    attribute: ff_root
    unit: cm
    low: 6.0                        # >= 6 cm de raiz = 18 cm de cola nas 3 aletas
    high: 16.0

  - name: fin_tip
    component: Conjunto de aletas de formato livre
    attribute: ff_tip
    unit: cm
    low: 0.0
    high: 16.0

  - name: fin_sweep
    component: Conjunto de aletas de formato livre
    attribute: ff_sweep
    unit: cm
    low: 0.0
    high: 14.0

  - name: fin_height
    component: Conjunto de aletas de formato livre
    attribute: ff_height
    unit: cm
    low: 2.0
    high: 14.0

  - name: fin_thickness
    component: Conjunto de aletas de formato livre
    attribute: thickness
    unit: mm
    low: 1.0                       # TRAVADO: chapa de poliestireno 1 mm
    high: 1.0

  - name: fin_material
    component: Conjunto de aletas de formato livre
    attribute: bulk_material
    choices: [poliestireno]        # TRAVADO: poliestireno

  - name: fin_cant
    component: Conjunto de aletas de formato livre
    attribute: cant_angle
    unit: deg
    low: 0.0                        # SEM cant (angulacao) nas aletas
    high: 0.0

  - name: fin_position
    component: Conjunto de aletas de formato livre
    attribute: position
    unit: cm
    low: -6.0
    high: -2.8

  # ---------- motor físico (cargas de vinagre; garrafa = 2 L) ----------
  - name: motor
    component: Garrafa 2L - cilindro
    attribute: motor
    choices:
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-0_6L.eng"
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-0_8L.eng"
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-1_0L.eng"
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-1_2L.eng"
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-1_4L.eng"
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-1_55L.eng"
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-1_7L.eng"
      - "file:D:\\OBAFOG\\bit04 2L script\\foguete_real\\motores\\VinagreReal-1_8L.eng"

  # ---------- ângulo do trilho de lançamento (graus da vertical) ----------
  - name: launch_angle
    component: Ogiva
    attribute: sim_launch_rod_angle_deg
    unit: ""
    low: 25.0
    high: 60.0

objective:
  metric: horizontal_distance
  direction: maximize

constraints:
  - metric: stability_static
    min: 0.15
  - metric: stability_max
    min: 1.0
    max: 3.5
  - metric: apogee
    min: 10.0
  - metric: fin_root_ratio         # raiz >= 30% da corda: nao deixa colar aleta
    min: 0.30                       #   grande por uma raiz minuscula (descola)
  - metric: fin_root_cm            # reforco do piso absoluto de 6 cm
    min: 6.0

optimizer:
  algorithm: adaptive
  max_evaluations: 10000
  seed: 42
  profile: balanced

batch:
  workers: 3

db_path: D:\OBAFOG\bit04 2L script\foguete_real\otimizacao_aletas\orx.sqlite
output_dir: D:\OBAFOG\bit04 2L script\foguete_real\otimizacao_aletas
